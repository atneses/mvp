# Tool configuration only. Dependencies live in requirements*.txt.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: common bugs,
# UP: modern syntax, DJ: Django-specific checks.
select = ["E", "W", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Django and contain long help texts and validators.
"**/migrations/*" = ["E501"]
