services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bravo_user
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: bravodb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 10s
      start_interval: 1s
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli ping)\" = 'PONG' ]"]
      start_period: 10s
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-dev.txt
    # Local dev: --reload restarts uvicorn on file save (the code is mounted below).
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload --no-access-log
    environment: &backend-env
      DJANGO_SECRET_KEY: dev-only-not-secret
      JWT_SIGNING_KEY: dev-only-not-secret-jwt-signing-key
      # Password of the demo users created by `make seed`.
      SEED_USERS_PASSWORD: bravo-demo
      DJANGO_DEBUG: "true"
      SIMULATORS_ENABLED: "true"
      ES_BANK_URL: http://api:8000/simulators/es/bank-profile
      MX_BANK_URL: http://api:8000/simulators/mx/bank-profile
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      DATABASE_URL: postgres://bravo_user:rootpassword@postgres:5432/bravodb?connect_timeout=2
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      args:
        REQUIREMENTS: requirements-dev.txt
    command: python manage.py run_worker
    environment:
      # Same settings as the api (YAML anchor), plus its own service name for the logs.
      <<: *backend-env
      SERVICE_NAME: worker
    # Two replicas: shows that jobs are shared out, never taken twice.
    deploy:
      replicas: 2
    restart: unless-stopped
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: